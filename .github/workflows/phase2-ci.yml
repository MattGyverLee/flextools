name: Phase 2 Development CI

on:
  push:
    branches:
      - 'claude/**'
      - 'main'
  pull_request:
    branches:
      - 'claude/expand-flextools-data-access-*'

jobs:
  verify:
    name: Verify Code Quality
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov pytest-xdist flake8 black mypy
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
        pip install -e .

    - name: Verify all modules import
      run: |
        echo "Testing core module imports..."
        python -c "from flexlibs_dev.core import *" || exit 1
        python -c "from flexlibs_dev.text_ops import *" || exit 1
        python -c "from flexlibs_dev.paragraph_segment_ops import *" || exit 1
        python -c "from flexlibs_dev.wordform_ops import *" || exit 1
        echo "✅ All modules import successfully"

    - name: Run tests with pytest
      run: |
        pytest flexlibs_dev/tests/ -v --cov=flexlibs_dev --cov-report=term-missing --cov-report=xml --cov-report=html -n auto
      continue-on-error: false

    - name: Upload coverage reports
      uses: codecov/codecov-action@v4
      if: matrix.python-version == '3.11'
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
      continue-on-error: true

    - name: Lint with flake8 (critical errors)
      run: |
        # Stop build on critical Python syntax errors or undefined names
        flake8 flexlibs_dev/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings for informational purposes
        flake8 flexlibs_dev/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Check formatting with black
      run: |
        black --check flexlibs_dev/ --diff
      continue-on-error: true

    - name: Type check with mypy
      run: |
        mypy flexlibs_dev/ --ignore-missing-imports --check-untyped-defs
      continue-on-error: true

    - name: Run verification script
      run: |
        chmod +x verify_agent_work.sh
        ./verify_agent_work.sh flexlibs_dev 29
      continue-on-error: false

    - name: Archive test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-py${{ matrix.python-version }}
        path: |
          htmlcov/
          coverage.xml
          .coverage

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: verify

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install -e .

    - name: Run integration tests
      run: |
        pytest flexlibs_dev/tests/test_integration.py -v --tb=short

    - name: Verify cross-module compatibility
      run: |
        python -c "
        from flexlibs_dev.core import types, resolvers, validators, exceptions
        from flexlibs_dev.text_ops import text_core, text_advanced, paragraph_crud
        from flexlibs_dev.paragraph_segment_ops import paragraph_advanced, segment_ops
        from flexlibs_dev.wordform_ops import wordform_crud, wordform_advanced
        print('✅ All modules loaded successfully')
        print('✅ Cross-module imports working')
        "

  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install quality tools
      run: |
        pip install flake8 black mypy pylint radon

    - name: Check code complexity
      run: |
        radon cc flexlibs_dev/ -a -nb
      continue-on-error: true

    - name: Check maintainability
      run: |
        radon mi flexlibs_dev/ -nb
      continue-on-error: true

    - name: Run pylint
      run: |
        pip install -e .
        pylint flexlibs_dev/ --exit-zero --score=yes
      continue-on-error: true

  documentation:
    name: Documentation Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Check required documentation
      run: |
        echo "Checking for required documentation files..."
        for file in README.md ARCHITECTURE.md CODING_STANDARDS.md TESTING_GUIDELINES.md; do
          if [ -f "flexlibs_dev/$file" ]; then
            echo "✅ Found: flexlibs_dev/$file"
          else
            echo "❌ Missing: flexlibs_dev/$file"
            exit 1
          fi
        done

    - name: Verify docstrings present
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Check docstring coverage
      run: |
        pip install interrogate
        interrogate flexlibs_dev/ -vv --fail-under=80 --exclude flexlibs_dev/tests
      continue-on-error: true

  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [verify, integration-test, code-quality, documentation]
    if: always()

    steps:
    - name: Check build status
      run: |
        echo "CI/CD Pipeline Complete"
        echo "Verify: ${{ needs.verify.result }}"
        echo "Integration: ${{ needs.integration-test.result }}"
        echo "Quality: ${{ needs.code-quality.result }}"
        echo "Docs: ${{ needs.documentation.result }}"
